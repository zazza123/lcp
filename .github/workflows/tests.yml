name: tests

on:
  push:
    branches: [main, "roadmap/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [main, "roadmap/**"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  release:
    types: [created]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: cache python environment
        uses: actions/cache@v6
        id: cache
        with:
          path: ${{ env.pythonLocation }}
          # The workflow file is part of the key because the ruff pin lives
          # here, not in pyproject.toml: keyed on pyproject alone, a cache
          # hit skips the install step and silently keeps whatever ruff
          # version the cache already holds, making the pin a no-op.
          key: ${{ runner.os }}-py-${{ env.pythonLocation }}-lint-${{ hashFiles('pyproject.toml', '.github/workflows/tests.yml') }}

      - name: install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip
          # Pinned deliberately. Unpinned, a ruff release that adds or
          # promotes rules turns this job red on every open PR without a
          # line of code changing: 0.16.0 did exactly that, flagging 78
          # pre-existing findings in src/lcp and 53 in tests, so main went
          # from green on 2026-07-23 to failing on work that never touched
          # those files. 0.15.22 is the newest release clean on both trees.
          # Bump this on purpose, in its own PR, together with whatever
          # fixes the new rules demand -- never as a side effect.
          pip install "ruff==0.15.22"
          pip install -e ".[dev]"

      - name: lint src
        run: ruff check src/lcp

      - name: lint tests
        run: ruff check tests

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: cache python environment
        uses: actions/cache@v6
        id: cache
        with:
          path: ${{ env.pythonLocation }}
          key: ${{ runner.os }}-py-${{ env.pythonLocation }}-test-${{ hashFiles('pyproject.toml') }}

      - name: install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --upgrade pip
          pip install -e ".[ai,dev]"

      - name: run tests with coverage
        run: coverage run -m pytest -v tests
        env:
          CONTEXT: ${{ runner.os }}-py${{ matrix.python-version }}

      - name: show coverage report
        run: coverage report -m

      - name: generate coverage xml
        run: coverage xml

      - name: upload coverage report
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
