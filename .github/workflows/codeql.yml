name: codeql

on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:
    branches: [main, "roadmap/**"]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python"]

    steps:
      - uses: actions/checkout@v7

      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # tests/sample_package is a re-export fixture: its "unused"
          # imports and star-import ARE the behavior under test.
          #
          # tests/hostile_objects.py defines fixtures that deliberately
          # raise RuntimeError (not AttributeError) from __getattr__ /
          # __getattribute__, to prove isinstance()'s __class__ fallback
          # doesn't swallow a proxy's exception (flask.request raises
          # RuntimeError). CodeQL's "non-standard exception raised in
          # special method" rule would suggest raising AttributeError
          # instead, which would silence the very bug these tests exist
          # to catch -- see the module docstring for details.
          config: |
            paths-ignore:
              - tests/sample_package
              - tests/hostile_objects.py

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
