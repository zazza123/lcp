- id: flask-json-route
  library: flask
  version: "3.1.3"
  prompt: >
    Build a minimal Flask application with a single GET route "/ping" that
    responds with the JSON object {"message": "pong"} and the correct
    application/json content type.
  checks:
    required_symbols: ["flask:Flask", "flask:Flask#route"]
    forbidden_symbols: ["flask:json_response"]

- id: flask-blueprint
  library: flask
  version: "3.1.3"
  prompt: >
    Build a Flask application and move its "users" routes into a separate
    modular component mounted under the URL prefix "/users", then attach that
    component to the main application.
  checks:
    required_symbols: ["flask:Blueprint", "flask:Flask#register_blueprint"]
    forbidden_symbols: ["flask:Flask#add_blueprint"]

- id: flask-error-handler
  library: flask
  version: "3.1.3"
  prompt: >
    Build a Flask app that returns the JSON body {"error": "not found"} with
    HTTP status 404 whenever a requested route does not exist, by registering
    a handler for 404 responses.
  checks:
    required_symbols: ["flask:Flask#errorhandler"]
    forbidden_symbols: ["flask:Flask#error_handler"]

- id: flask-redirect-endpoint
  library: flask
  version: "3.1.3"
  prompt: >
    Build a Flask app with a route "/old" that sends visitors to the "/new"
    route, resolving the target path from the destination view function's
    endpoint name rather than hardcoding the URL string.
  checks:
    required_symbols: ["flask:redirect", "flask:url_for"]
    forbidden_symbols: ["flask:redirect_to"]

- id: flask-custom-response
  library: flask
  version: "3.1.3"
  prompt: >
    Build a Flask route that responds with the text "hi", HTTP status 201, and
    a custom header "X-App: demo". Inside the view, first convert the body
    string into a response object, then set the status code and add the header
    on that object before returning it — do not use the tuple-return shortcut.
  checks:
    required_symbols: ["flask:make_response"]
    forbidden_symbols: ["flask:build_response"]

- id: flask-test-client
  library: flask
  version: "3.1.3"
  prompt: >
    Given a Flask app object, write code that exercises its "/" route
    in-process, without starting a real server or opening a network socket,
    and asserts that the response status code is 200.
  checks:
    required_symbols: ["flask:Flask#test_client"]
    forbidden_symbols: ["flask:Flask#test_app"]
