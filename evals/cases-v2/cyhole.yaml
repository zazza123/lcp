- id: cyhole-dexscreener-token-pairs
  library: cyhole
  version: "0.3.0"
  prompt: >
    Using cyhole's DexScreener interaction, write synchronous code that
    retrieves every trading pair for a single SPL token, given its mint
    address on the Solana chain, and prints how many pairs were returned.
    DexScreener needs no API key.
  checks:
    required_symbols:
      - "cyhole.dex_screener.interaction:DexScreener"
      - "cyhole.dex_screener.client:DexScreenerClient#get_token_pairs"
    forbidden_symbols:
      - "cyhole.dex_screener.client:DexScreenerClient#get_token_pools"
      - "cyhole.dex_screener.client:DexScreenerClient#fetch_token_pairs"

- id: cyhole-helius-get-asset
  library: cyhole
  version: "0.3.0"
  prompt: >
    Using cyhole's Helius interaction, fetch the full Digital Asset Standard
    (DAS) metadata for a single asset given its id. Read the Helius API key
    from the HELIUS_API_KEY environment variable and run the request
    synchronously.
  checks:
    required_symbols:
      - "cyhole.helius.interaction:Helius"
      - "cyhole.helius.client:HeliusClient#post_get_asset"
    forbidden_symbols:
      - "cyhole.helius.client:HeliusClient#get_asset"
      - "cyhole.helius.client:HeliusClient#post_asset"

- id: cyhole-helius-assets-by-owner
  library: cyhole
  version: "0.3.0"
  prompt: >
    Using cyhole's Helius interaction, list all the Digital Asset Standard
    assets owned by a given wallet address. Read the API key from the
    HELIUS_API_KEY environment variable and perform the call synchronously.
  checks:
    required_symbols:
      - "cyhole.helius.interaction:Helius"
      - "cyhole.helius.client:HeliusClient#post_get_assets_by_owner"
    forbidden_symbols:
      - "cyhole.helius.client:HeliusClient#get_assets_by_owner"
      - "cyhole.helius.client:HeliusClient#post_get_owner_assets"

- id: cyhole-solanafm-account-transfers
