- id: cyhole-async-session-error
  library: cyhole
  version: "0.3.0"
  prompt: >
    Using cyhole's SolanaFM interaction, write asynchronous code that calls
    a method on its asynchronous client WITHOUT first entering the client's
    async context manager, and catch the cyhole exception that signals the
    async HTTP session is not available. Read the API key from the
    SOLANA_FM_API_KEY environment variable.
  checks:
    required_symbols:
      - "cyhole.solana_fm.interaction:SolanaFM"
      - "cyhole.core.exception:AsyncClientAPISessionNotAvailable"
    forbidden_symbols:
      - "cyhole.core.exception:AsyncSessionNotStartedError"
      - "cyhole.core.exception:SessionNotAvailableError"
