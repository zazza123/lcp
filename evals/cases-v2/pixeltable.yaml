- id: pixeltable-create-insert
  library: pixeltable
  version: "0.6.6"
  prompt: >
    Using pixeltable, create a directory "demo" and a table "demo.films"
    with columns: title (string), year (int) and revenue (float). Then add
    two rows - ('Jaws', 1975, 470.7) and ('Alien', 1979, 184.7) - to the
    table in a single call.
  checks:
    required_symbols: ["pixeltable:create_table", "pixeltable:Table#insert"]
    forbidden_symbols: ["pixeltable:connect", "pixeltable:Table#add_row"]

- id: pixeltable-computed-column
  library: pixeltable
  version: "0.6.6"
  prompt: >
    A pixeltable table `films` has numeric columns "revenue" and "budget".
    Using pixeltable's incremental-computation model, add a new column
    "profit" that pixeltable itself keeps computed as revenue minus budget
    for every existing and future row - do not compute the values in Python
    and write them back.
  checks:
    required_symbols: ["pixeltable:Table#add_computed_column"]
    forbidden_symbols:
      - "pixeltable:Table#with_column"
      - "pixeltable:Table#assign"

- id: pixeltable-udf
  library: pixeltable
  version: "0.6.6"
  prompt: >
    Using pixeltable, define a custom Python function
    `word_count(text: str) -> int` that pixeltable can evaluate inside
    queries and computed columns (register it with the decorator pixeltable
    provides for user-defined functions), then use it to add an
    automatically maintained "n_words" column to the existing table `docs`,
    derived from its "content" column.
  checks:
    required_symbols: ["pixeltable:udf", "pixeltable:Table#add_computed_column"]
    forbidden_symbols: ["pixeltable:create_udf", "pixeltable:Table#map"]

- id: pixeltable-query
  library: pixeltable
  version: "0.6.6"
  prompt: >
    Using pixeltable, query the existing table `films`: keep only the rows
    whose "year" column is greater than 1990, project just the "title" and
    "revenue" columns, and then materialize the result rows locally
    (pixeltable queries stay lazy until you retrieve them).
  checks:
    required_symbols: ["pixeltable:Table#where", "pixeltable:Table#collect"]
    forbidden_symbols: ["pixeltable:Table#filter", "pixeltable:Table#query"]

- id: pixeltable-update-rows
  library: pixeltable
  version: "0.6.6"
  prompt: >
    Using pixeltable, apply a correction to the stored table `films`: for
    every row whose "studio" column equals "WB", set its "distributor"
    column to "Warner Bros.". Do it as one set-based operation on the table,
    not by iterating over rows in Python.
  checks:
    required_symbols: ["pixeltable:Table#update"]
    forbidden_symbols:
      - "pixeltable:Table#set_column"
      - "pixeltable:Table#batch_write"

- id: pixeltable-import-csv
  library: pixeltable
  version: "0.6.6"
  prompt: >
    Using pixeltable, create and fill a new table "demo.trades" directly
    from the local file "trades.csv" (headers in the first row), letting
    pixeltable infer the schema. Use the dedicated tabular-import helper in
    pixeltable's io namespace rather than inserting rows manually.
  checks:
    required_symbols: ["pixeltable.io:import_csv"]
    forbidden_symbols: ["pixeltable:read_csv", "pixeltable:from_pandas"]

- id: pixeltable-video-frames
  library: pixeltable
  version: "0.6.6"
  prompt: >
    Using pixeltable, set up frame-level analysis over videos: given an
    existing table `videos` with a "video" column, create a view that
    expands each video into one row per frame sampled at 1 fps, using
    pixeltable's built-in frame-extraction iterator.
  checks:
    required_symbols:
      - "pixeltable:create_view"
      - "pixeltable.iterators:FrameIterator"
    forbidden_symbols: ["pixeltable:Table#extract_frames"]

- id: pixeltable-similarity-search
  library: pixeltable
  version: "0.6.6"
  prompt: >
    Using pixeltable, enable semantic search over the "content" column of
    the existing text table `docs`: first create the index pixeltable needs
    for nearest-neighbor lookups on that column, embedding the text with the
    sentence-transformers UDF pixeltable ships (model
    "all-MiniLM-L6-v2"), then run a query that returns the 5 rows whose
    content is semantically closest to the string "climate change policy",
    ranked from closest to farthest.
  checks:
    required_symbols:
      - "pixeltable:Table#add_embedding_index"
      - "pixeltable.exprs:ColumnRef#similarity"
      - "pixeltable.functions.huggingface:sentence_transformer"
    forbidden_symbols: ["pixeltable:Table#search", "pixeltable:Table#create_index"]
