- id: pydantic-settings
  library: pydantic
  version: "2.13.4"
  prompt: >
    Load application configuration (a database URL string and a debug boolean)
    from environment variables using pydantic.
  checks:
    required_symbols: []
    forbidden_symbols: ["pydantic:BaseSettings"]

- id: pydantic-validate-call
  library: pydantic
  version: "2.13.4"
  prompt: >
    Use pydantic to validate the arguments of a plain Python function
    add(a: int, b: int) -> int at call time, so add("1", "2") coerces or fails.
  checks:
    required_symbols: ["pydantic:validate_call"]
    forbidden_symbols: ["pydantic:validate_function_call"]

- id: pydantic-field-validator
  library: pydantic
  version: "2.13.4"
  prompt: >
    Define a pydantic model User with an email field, and validate that the
    email contains "@" using pydantic v2 style validators.
  checks:
    required_symbols: ["pydantic:field_validator"]
    forbidden_symbols: []

- id: pydantic-json-schema
  library: pydantic
  version: "2.13.4"
  prompt: >
    Given a pydantic model, produce its JSON schema as a dict and serialize a
    model instance to a JSON string, using pydantic v2 methods.
  checks:
    required_symbols:
      - "pydantic:BaseModel#model_json_schema"
      - "pydantic:BaseModel#model_dump_json"
    forbidden_symbols: []
