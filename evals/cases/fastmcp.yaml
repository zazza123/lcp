- id: fastmcp-server-tool
  library: fastmcp
  version: "2.14.4"
  prompt: >
    Create an MCP server named "calc" with fastmcp that exposes a tool
    add(a: int, b: int) -> int, and run it with the stdio transport.
  checks:
    required_symbols:
      - "fastmcp:FastMCP"
      - "fastmcp:FastMCP#tool"
      - "fastmcp:FastMCP#run"
    forbidden_symbols: ["fastmcp:Server"]

- id: fastmcp-resource
  library: fastmcp
  version: "2.14.4"
  prompt: >
    Using fastmcp, expose a static resource at the URI "data://config" that
    returns a configuration dict.
  checks:
    required_symbols: ["fastmcp:FastMCP#resource"]
    forbidden_symbols: ["fastmcp:FastMCP#register_resource"]

- id: fastmcp-client
  library: fastmcp
  version: "2.14.4"
  prompt: >
    Write async code using fastmcp's client to connect to a local MCP server
    script "server.py" over stdio, list its tools, and call the tool "add"
    with a=1, b=2.
  checks:
    required_symbols: ["fastmcp:Client"]
    forbidden_symbols: ["fastmcp:FastMCPClient"]

- id: fastmcp-context
  library: fastmcp
  version: "2.14.4"
  prompt: >
    Create a fastmcp tool that reports progress by logging an info message via
    the MCP context while it processes a list of items.
  checks:
    required_symbols: ["fastmcp:Context"]
    forbidden_symbols: ["fastmcp:ToolContext"]
