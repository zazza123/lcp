- id: cyhole-birdeye-price
  library: cyhole
  version: "0.3.0"
  prompt: >
    Using cyhole, instantiate the Birdeye interaction and fetch the current
    price of a Solana token address synchronously.
  checks:
    required_symbols:
      - "cyhole.birdeye.interaction:Birdeye"
      - "cyhole.birdeye.client:BirdeyeClient#get_price"
    forbidden_symbols:
      - "cyhole.birdeye.client:BirdeyeClient#fetch_price"
      - "cyhole:Birdeye"

- id: cyhole-jupiter-swap
  library: cyhole
  version: "0.3.0"
  prompt: >
    Using cyhole's Jupiter interaction, request a swap order (quote) to swap
    SOL for USDC and then execute that swap.
  checks:
    required_symbols:
      - "cyhole.jupiter.interaction:Jupiter"
      - "cyhole.jupiter.client:JupiterClient#get_swap_order"
      - "cyhole.jupiter.client:JupiterClient#post_swap_execute"
    forbidden_symbols:
      - "cyhole.jupiter.client:JupiterClient#get_swap_quote"
      - "cyhole.jupiter.client:JupiterClient#post_swap"

- id: cyhole-rugcheck-report
  library: cyhole
  version: "0.3.0"
  prompt: >
    Using cyhole's Rugcheck interaction, retrieve the full risk report for a
    given Solana token mint address.
  checks:
    required_symbols:
      - "cyhole.rugcheck.interaction:Rugcheck"
      - "cyhole.rugcheck.client:RugcheckClient#get_token_report"
    forbidden_symbols:
      - "cyhole.rugcheck.client:RugcheckClient#get_report_token"
      - "cyhole:Rugcheck"

- id: cyhole-missing-api-key
  library: cyhole
  version: "0.3.0"
  prompt: >
    Write code that instantiates cyhole's Birdeye interaction without an API
    key and catches the library's specific exception raised in that case.
  checks:
    required_symbols:
      - "cyhole.core.exception:MissingAPIKeyError"
    forbidden_symbols:
      - "cyhole.core.exception:APIKeyMissingError"
      - "cyhole.birdeye.exception:MissingAPIKeyError"
