- id: httpx-client
  library: httpx
  version: "0.28.1"
  prompt: >
    Create a reusable httpx HTTP client with base URL "https://api.example.com"
    and make a GET request to "/users" with a bearer token authorization header.
  checks:
    required_symbols: ["httpx:Client"]
    forbidden_symbols: ["httpx:Session"]

- id: httpx-retries
  library: httpx
  version: "0.28.1"
  prompt: >
    Configure an httpx client so that failed connection attempts are retried
    up to 3 times.
  checks:
    required_symbols: ["httpx:HTTPTransport"]
    forbidden_symbols: ["httpx:HTTPAdapter", "httpx:Retry"]

- id: httpx-stream
  library: httpx
  version: "0.28.1"
  prompt: >
    Download a large file from "https://example.com/big.bin" with httpx,
    streaming it to disk in chunks without loading the whole body into memory.
  checks:
    required_symbols: ["httpx:Response#iter_bytes"]
    forbidden_symbols: ["httpx:Response#iter_content"]

- id: httpx-async
  library: httpx
  version: "0.28.1"
  prompt: >
    Fetch three URLs concurrently using httpx and asyncio and print each
    response's status code.
  checks:
    required_symbols: ["httpx:AsyncClient"]
    forbidden_symbols: ["httpx:Session", "httpx:async_get"]
